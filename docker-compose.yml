# Local development stack. SQL Server listens on host port 14330 (loopback only).
# Optional: `docker compose --profile app up -d --build` also runs the production image on port 5180.
name: docroof

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: docroof-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DocRoof_Local_Dev_2026!}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - docroof-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docroof-app
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DocRoof: "Server=sql,1433;Database=DocRoofContainer;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DocRoof_Local_Dev_2026!};TrustServerCertificate=True;Encrypt=True"
      Database__MigrateOnStartup: "true"
      Database__SeedSampleTenant: "true"
      Storage__Mode: Database
      Demo__IpHashSalt: ${DEMO_IP_HASH_SALT:-change-me-per-deployment}
      # Plain-http local container only: allows cookies without the Secure flag. Never set this in a hosted deployment.
      Cookies__AllowInsecure: "true"
    ports:
      - "127.0.0.1:5180:8080"

volumes:
  docroof-sql-data:
